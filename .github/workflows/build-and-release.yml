name: Build and Release

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release from the selected v* tag ref"
        required: true
        type: boolean
        default: false
      draft_release:
        description: "Mark a manually published release as draft"
        required: true
        type: boolean
        default: false
      prerelease:
        description: "Mark a manually published release as prerelease"
        required: true
        type: boolean
        default: false

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (runner Python)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare the pinned release verification runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'

      - name: Verify immutable release and lost-response behavior
        run: node --test scripts/publish-release.test.mjs

      - name: Verify short private container runtimes and scoped cleanup
        run: bash scripts/test-ci-podman.sh

      - name: Use runner Python runtime
        run: python3 --version

      - name: Ensure Python tooling is available
        run: |
          python3 -m pip --version || (
            sudo apt-get update &&
            sudo apt-get install -y --no-install-recommends python3-pip python3-venv
          )

      - name: Install Dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -e .

      - name: Run Test Suite
        run: .venv/bin/python -m pytest -q

  nmstt-rust:
    name: nmstt Rust Build/Test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect nmstt Rust crate
        id: nmstt_crate
        run: |
          candidates=()
          if [[ -n "${NMSTT_DIR:-}" ]]; then
            candidates+=("${NMSTT_DIR}")
          fi
          if [[ -n "${GITHUB_WORKSPACE:-}" ]]; then
            candidates+=("${GITHUB_WORKSPACE}/../nmstt")
            candidates+=("$(dirname "${GITHUB_WORKSPACE}")/nmstt")
          fi
          candidates+=("${NM_LOCAL_REPO_ROOT}/nmstt")

          for candidate in "${candidates[@]}"; do
            if [[ -f "${candidate}/Cargo.toml" ]]; then
              resolved="$(cd "${candidate}" && pwd)"
              echo "path=${resolved}" >> "$GITHUB_OUTPUT"
              echo "manifest=${resolved}/Cargo.toml" >> "$GITHUB_OUTPUT"
              echo "present=true" >> "$GITHUB_OUTPUT"
              echo "Using nmstt crate at ${resolved}"
              exit 0
            fi
          done

          echo "path=" >> "$GITHUB_OUTPUT"
          echo "manifest=" >> "$GITHUB_OUTPUT"
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "No nmstt crate detected on this runner."

      - name: Ensure rustup supports quiet toolchain listing
        if: steps.nmstt_crate.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "$HOME/.cargo/bin/rustup" ]] && "$HOME/.cargo/bin/rustup" toolchain list --quiet >/dev/null 2>&1; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          if rustup toolchain list --quiet >/dev/null 2>&1; then
            exit 0
          fi

          echo "Installing upstream rustup because system rustup lacks '--quiet' support."
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Setup Rust Toolchain
        if: steps.nmstt_crate.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Export Rust environment paths
        if: steps.nmstt_crate.outputs.present == 'true'
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"

      - name: Install Native Build Dependencies
        if: steps.nmstt_crate.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config clang libclang-dev

      - name: Cache Rust Artifacts
        if: steps.nmstt_crate.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ steps.nmstt_crate.outputs.path }} -> target

      - name: Build nmstt Rust Crate
        if: steps.nmstt_crate.outputs.present == 'true'
        run: cargo build --locked --manifest-path "${{ steps.nmstt_crate.outputs.manifest }}"

      - name: Test nmstt Rust Crate
        if: steps.nmstt_crate.outputs.present == 'true'
        run: cargo test --locked --manifest-path "${{ steps.nmstt_crate.outputs.manifest }}" --all-targets

      - name: Skip nmstt Rust Crate checks
        if: steps.nmstt_crate.outputs.present != 'true'
        run: echo "No nmstt Cargo.toml was detected on this runner; skipping Rust service build/test."

  package-release:
    name: Package Release
    needs:
      - test
      - nmstt-rust
    # The wheel is pure Python and the Debian package declares Architecture: all.
    # Use the existing X64 runner instead of waiting for an ARM64-only runner.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      artifact_version: ${{ steps.meta.outputs.artifact_version }}
      package_version: ${{ steps.meta.outputs.package_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      build_number: ${{ steps.meta.outputs.build_number }}
      git_commit: ${{ steps.meta.outputs.git_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use runner Python runtime
        run: python3 --version

      - name: Ensure Python tooling is available
        run: |
          python3 -m pip --version || (
            sudo apt-get update &&
            sudo apt-get install -y --no-install-recommends python3-pip python3-venv
          )

      - name: Install Build Tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install build twine

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(
            sed -n '/^\[project\]/,/^\[/ s/^version = "\(.*\)"/\1/p' pyproject.toml |
              head -n 1
          )
          if [[ -z "$package_version" ]]; then
            echo "::error::Unable to determine pyproject project.version"
            exit 1
          fi
          short_sha="${GITHUB_SHA:0:7}"
          release_tag=""

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF#refs/tags/}"
            artifact_version="${release_tag#v}"
          else
            artifact_version="${package_version}-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.${short_sha}"
            if [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_REF}" == refs/heads/master || "${GITHUB_REF}" == refs/heads/develop ]]; then
              release_tag="v${artifact_version}"
            fi
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* && "$artifact_version" != "$package_version" ]]; then
            echo "::error::Tag ${release_tag} does not match pyproject.toml"
            echo "::error::version ${package_version}"
            exit 1
          fi

          artifact_name="refiner-dist-${artifact_version}"
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          git_commit="${GITHUB_SHA}"

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "git_commit=$git_commit" >> "$GITHUB_OUTPUT"

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          alias_args=()
          release_tag="${{ steps.meta.outputs.release_tag }}"
          if [[ "${release_tag}" == latest-* ]]; then
            alias_args=(--deb-channel-alias "${release_tag}")
          fi

          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh \
            --version "${{ steps.meta.outputs.package_version }}" \
            --deb-version "${{ steps.meta.outputs.artifact_version }}" \
            --build-number "${{ steps.meta.outputs.build_number }}" \
            --git-commit "${{ steps.meta.outputs.git_commit }}" \
            "${alias_args[@]}" \
            --python ".venv/bin/python" \
            --output-dir ./dist

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Attest packaged source and build
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/*

  publish-release:
    name: Publish Release
    needs: package-release
    runs-on: [self-hosted, Linux, X64]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/develop'
        )
      ) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    permissions:
      contents: write

    steps:
      - name: Check out the exact source publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Prepare the pinned publisher runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'

      - name: Validate publish target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ needs.package-release.outputs.release_tag }}" ]]; then
            echo "::error::Publishing requires a resolved release_tag from package metadata"
            exit 1
          fi

      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.package-release.outputs.artifact_name }}
          path: ./dist

      - name: Publish immutable source-bound release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package-release.outputs.release_tag }}
          DRAFT_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_release }}
          MANUAL_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
        run: node scripts/publish-release.mjs

  publish-container-arch:
    name: Publish Container (${{ matrix.variant }})
    needs: [package-release, publish-release]
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    timeout-minutes: 120
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/develop'
        )
      ) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: linux/amd64
            runner_labels: '["self-hosted","Linux","X64"]'
            runner_arch: x86_64
            variant: amd64
            page_size: 4k
          - platform: linux/arm64
            runner_labels: '["self-hosted","Linux","ARM64"]'
            runner_arch: aarch64
            variant: arm64-4k
            page_size: 4k
          - platform: linux/arm64
            runner_labels: '["self-hosted","Linux","ARM64"]'
            runner_arch: aarch64
            variant: arm64-64k-hwe
            page_size: 64k-hwe

    steps:
      - name: Check out exact image source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Prepare the pinned image verification runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'

      - name: Prepare isolated rootless container runtime
        run: |
          set -euo pipefail
          test "$(df -Pk /var/tmp | awk 'NR == 2 { print $4 }')" -ge 20971520
          bash scripts/ci-podman.sh --prepare

      - name: Log in with the job's private registry credential
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD || github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_PASSWORD" | "$CONTAINER_RUNTIME" login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Build and push on the required native architecture
        env:
          IMAGE_REF: ghcr.io/neuralmimicry/refiner:${{ needs.package-release.outputs.release_tag }}-${{ matrix.variant }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.runner_arch }}"
          test "$GITHUB_SHA" = "${{ needs.package-release.outputs.git_commit }}"
          runtime_args=()
          if [[ "${{ matrix.runner_arch }}" == aarch64 ]] && command -v runc >/dev/null; then
            runtime_args=(--runtime "$(command -v runc)")
          fi
          "$CONTAINER_RUNTIME" "${runtime_args[@]}" build --network=slirp4netns --format docker --pull \
            --build-arg BUILD_NUMBER="${{ needs.package-release.outputs.build_number }}" \
            --build-arg GIT_COMMIT="$GITHUB_SHA" \
            --build-arg TARGET_PAGE_SIZE="${{ matrix.page_size }}" \
            -f Containerfile -t "$IMAGE_REF" .
          "$CONTAINER_RUNTIME" push --format v2s2 --compression-format gzip \
            --digestfile "$RUNNER_TEMP/refiner-${{ matrix.variant }}-digest" "$IMAGE_REF"

      - name: Independently verify pushed digest and image source
        id: image_identity
        env:
          IMAGE_REF: ghcr.io/neuralmimicry/refiner:${{ needs.package-release.outputs.release_tag }}-${{ matrix.variant }}
          IMAGE_DIGEST_FILE: ${{ runner.temp }}/refiner-${{ matrix.variant }}-digest
          IMAGE_PLATFORM: ${{ matrix.platform }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD || github.token }}
        run: node scripts/publish-release.mjs --image

      - name: Attest immutable image source and build
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/neuralmimicry/refiner
          subject-digest: ${{ steps.image_identity.outputs.digest }}

      - name: Remove the job's private container runtime
        if: ${{ always() && env.CONDUCTOR_PODMAN_ROOT != '' }}
        run: bash scripts/ci-podman.sh --cleanup

  publish-container-manifest:
    name: Publish Container Manifest
    needs:
      - package-release
      - publish-container-arch
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/develop'
        )
      ) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out exact image source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Prepare the pinned image verification runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'

      - name: Prepare isolated rootless container runtime
        run: |
          set -euo pipefail
          test "$(df -Pk /var/tmp | awk 'NR == 2 { print $4 }')" -ge 20971520
          bash scripts/ci-podman.sh --prepare

      - name: Log in with the job's private registry credential
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD || github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_PASSWORD" | "$CONTAINER_RUNTIME" login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Publish the same-source native architecture index
        env:
          IMAGE_REF: ghcr.io/neuralmimicry/refiner:${{ needs.package-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          manifest="refiner-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "$CONTAINER_RUNTIME" manifest create "$manifest"
          "$CONTAINER_RUNTIME" manifest add "$manifest" "docker://$IMAGE_REF-amd64"
          "$CONTAINER_RUNTIME" manifest add "$manifest" "docker://$IMAGE_REF-arm64-4k"
          "$CONTAINER_RUNTIME" manifest push --all --format v2s2 \
            --digestfile "$RUNNER_TEMP/refiner-manifest-digest" "$manifest" "docker://$IMAGE_REF"

      - name: Independently verify pushed digest and image source
        id: image_identity
        env:
          IMAGE_REF: ghcr.io/neuralmimicry/refiner:${{ needs.package-release.outputs.release_tag }}
          IMAGE_DIGEST_FILE: ${{ runner.temp }}/refiner-manifest-digest
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD || github.token }}
        run: node scripts/publish-release.mjs --image

      - name: Attest immutable image source and build
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/neuralmimicry/refiner
          subject-digest: ${{ steps.image_identity.outputs.digest }}

      - name: Remove the job's private container runtime
        if: ${{ always() && env.CONDUCTOR_PODMAN_ROOT != '' }}
        run: bash scripts/ci-podman.sh --cleanup
